services:
  db:
    image: "mcr.microsoft.com/mssql/server:2022-latest"
    container_name: riftarena-db
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: "Developer"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  riftarena:
    image: riftarena:local
    build:
      context: .
      dockerfile: RiftARENA/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "https://+:5001"
      Kestrel__Endpoints__Https__Url: "https://+:5001"
      Kestrel__Endpoints__Https__Certificate__Path: "/app/certificates/localhost.pfx"
      Kestrel__Endpoints__Https__Certificate__Password: ${CERTIFICATE_PASSWORD}
      ConnectionStrings__RiftArena: "Server=db;Database=RiftArena;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
    ports:
      - "5001:5001"
    volumes:
      - ./RiftARENA/certificates:/app/certificates:ro
    restart: unless-stopped